[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orca-objective-reduction"
version = "0.1.0"
description = "Objective Reduction Community Algorithm for nonlinear many-objective optimization"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26,<3", "scipy>=1.10,<2"]

[project.optional-dependencies]
leiden = ["python-igraph==0.11.9", "leidenalg==0.10.2"]
pyomo = ["pyomo>=6.8,<7"]
experiments = [
    "pandas>=2.2,<3", "matplotlib>=3.8,<4", "networkx>=3,<4",
    "pymoo==0.6.1.6", "optproblems==1.3", "diversipy==0.9",
    "pillow>=10", "pyomo>=6.8,<7", "openpyxl>=3.1,<4",
]
test = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["orca", "orca.*"]

