[tool.poetry]
name = "orca-python"
version = "0.1.0"
description = "Python translation of ORCA objective correlation analysis utilities."
authors = ["Hongxuan Wang <yunqing@ualberta.ca>"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10,<3.13"
numpy = ">=1.26,<2.3"
scipy = ">=1.10,<1.15"
pyomo = "^6.8.0"
python-igraph = "^0.11.0"
leidenalg = "^0.10.0"
pandas = "^2.2.0"
openpyxl = "^3.1.0"
optproblems = "^1.3"
diversipy = "^0.9"
pymoo = "^0.6.1"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"

[build-system]
requires = ["poetry-core>=1.8.0"]
build-backend = "poetry.core.masonry.api"
